<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">PickPlace runtime process</title>
  <desc id="desc">Runtime flow from point cloud capture to basket placement.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#eef6ff"/>
  <rect x="54" y="48" width="1092" height="424" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="102" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">PickPlace Runtime</text>
  <text x="88" y="134" fill="#475569" font-family="Arial, sans-serif" font-size="16">Point cloud perception, grasp planning, gripper control, and basket placement in ROS 2 Humble.</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="190" width="178" height="152" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="136" cy="252" r="12" fill="#2563eb"/>
    <circle cx="182" cy="228" r="7" fill="#2563eb"/>
    <circle cx="216" cy="272" r="9" fill="#2563eb"/>
    <circle cx="198" cy="303" r="6" fill="#2563eb"/>
    <text x="114" y="382" fill="#1e3a8a" font-size="17" font-weight="700">1. Point Cloud</text>

    <path d="M284 266 H358" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M346 252 L362 266 L346 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="380" y="190" width="178" height="152" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="430" y="228" width="78" height="70" rx="10" fill="#22c55e"/>
    <circle cx="470" cy="263" r="22" fill="#bbf7d0" stroke="#15803d" stroke-width="4"/>
    <text x="408" y="382" fill="#166534" font-size="17" font-weight="700">2. Pose Estimate</text>

    <path d="M574 266 H648" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M636 252 L652 266 L636 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="670" y="190" width="178" height="152" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <path d="M722 302 L760 226 L806 302" fill="none" stroke="#92400e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="744" y="252" width="36" height="42" rx="7" fill="#f59e0b"/>
    <text x="704" y="382" fill="#92400e" font-size="17" font-weight="700">3. MoveIt Grasp</text>

    <path d="M864 266 H938" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M926 252 L942 266 L926 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="960" y="190" width="178" height="152" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M1005 238 h88 l-14 80 h-60z" fill="#fecaca" stroke="#b91c1c" stroke-width="5"/>
    <circle cx="1049" cy="270" r="17" fill="#ef4444"/>
    <text x="998" y="382" fill="#991b1b" font-size="17" font-weight="700">4. Basket Place</text>
  </g>

  <rect x="88" y="418" width="1002" height="1" fill="#e2e8f0"/>
  <text x="88" y="448" fill="#334155" font-family="Menlo, Consolas, monospace" font-size="15">bash scripts/run_project.sh pick-place launch</text>
</svg>
