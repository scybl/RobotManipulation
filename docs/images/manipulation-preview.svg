<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">RobotManipulation ROS manipulation showcase</title>
  <desc id="desc">A polished README preview showing two ROS 2 manipulation demos for pick place and shape sorting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.46" stop-color="#7c2d12"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="56" y="50" width="1088" height="575" rx="28" fill="#f8fafc" filter="url(#shadow)"/>
  <rect x="56" y="50" width="1088" height="122" rx="28" fill="#111827"/>
  <rect x="56" y="136" width="1088" height="36" fill="#111827"/>
  <text x="96" y="104" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">RobotManipulation</text>
  <text x="96" y="141" fill="#fed7aa" font-family="Arial, sans-serif" font-size="18">ROS 2 perception-to-action demos with functional package names</text>
  <rect x="884" y="82" width="212" height="44" rx="22" fill="#22c55e"/>
  <text x="932" y="110" fill="#052e16" font-family="Arial, sans-serif" font-size="15" font-weight="700">2 Demo Pipelines</text>

  <g transform="translate(96 210)">
    <rect width="486" height="300" rx="24" fill="#ffffff" stroke="#dbeafe"/>
    <text x="30" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">PickPlace</text>
    <text x="30" y="78" fill="#64748b" font-family="Arial, sans-serif" font-size="15">point cloud -> target pose -> grasp -> basket</text>
    <circle cx="82" cy="158" r="32" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <rect x="172" y="130" width="72" height="56" rx="12" fill="#22c55e"/>
    <rect x="308" y="124" width="82" height="68" rx="12" fill="#f59e0b"/>
    <path d="M116 158 H166" stroke="#64748b" stroke-width="5"/>
    <path d="M248 158 H302" stroke="#64748b" stroke-width="5"/>
    <rect x="30" y="232" width="378" height="42" rx="12" fill="#0b1220"/>
    <text x="52" y="258" fill="#93c5fd" font-family="Menlo, Consolas, monospace" font-size="14">ros2 launch pick_place_solution ...</text>
  </g>

  <g transform="translate(620 210)">
    <rect width="480" height="300" rx="24" fill="#ffffff" stroke="#fef3c7"/>
    <text x="30" y="50" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700">ShapeSorting</text>
    <text x="30" y="78" fill="#64748b" font-family="Arial, sans-serif" font-size="15">scene scan -> nought/cross class -> sorted placement</text>
    <circle cx="88" cy="158" r="30" fill="#ffffff" stroke="#22c55e" stroke-width="5"/>
    <path d="M176 130 h58 l30 30 -30 30 h-58 l-30 -30z" fill="#ffffff" stroke="#8b5cf6" stroke-width="5"/>
    <rect x="330" y="126" width="70" height="70" rx="13" fill="#ef4444"/>
    <path d="M122 158 H146" stroke="#64748b" stroke-width="5"/>
    <path d="M268 158 H324" stroke="#64748b" stroke-width="5"/>
    <rect x="30" y="232" width="390" height="42" rx="12" fill="#0b1220"/>
    <text x="52" y="258" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="14">ros2 launch shape_sorting_solution ...</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="548" width="220" height="46" rx="23" fill="#dbeafe"/>
    <text x="130" y="577" fill="#1d4ed8" font-size="15" font-weight="700">ROS 2 Humble</text>
    <rect x="346" y="548" width="246" height="46" rx="23" fill="#dcfce7"/>
    <text x="387" y="577" fill="#15803d" font-size="15" font-weight="700">8 structure tests</text>
    <rect x="622" y="548" width="220" height="46" rx="23" fill="#fef3c7"/>
    <text x="660" y="577" fill="#92400e" font-size="15" font-weight="700">MoveIt + Gazebo</text>
    <rect x="872" y="548" width="228" height="46" rx="23" fill="#fce7f3"/>
    <text x="907" y="577" fill="#be185d" font-size="15" font-weight="700">Functional names</text>
  </g>
</svg>
