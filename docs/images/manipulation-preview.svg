<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">RobotManipulation workflow preview</title>
  <desc id="desc">Two ROS manipulation pipelines for pick place and shape sorting.</desc>
  <rect width="1000" height="560" fill="#f6f7f9"/>
  <rect x="46" y="42" width="908" height="476" rx="18" fill="#ffffff" stroke="#d9dee7"/>
  <text x="82" y="92" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">RobotManipulation</text>
  <text x="82" y="124" fill="#647184" font-family="Arial, sans-serif" font-size="17">ROS 2 perception-to-manipulation demos with functional package names</text>

  <g transform="translate(86 172)">
    <rect width="390" height="282" rx="14" fill="#eef7ff" stroke="#9cccf2"/>
    <text x="28" y="44" fill="#12324a" font-family="Arial, sans-serif" font-size="24" font-weight="700">PickPlace</text>
    <circle cx="82" cy="118" r="30" fill="#ffffff" stroke="#1f6feb" stroke-width="5"/>
    <rect x="160" y="94" width="70" height="50" rx="8" fill="#10b981"/>
    <rect x="278" y="88" width="70" height="64" rx="8" fill="#f59e0b"/>
    <path d="M112 118 H155" stroke="#40566d" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M232 118 H273" stroke="#40566d" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="48" y="196" fill="#40566d" font-family="Arial, sans-serif" font-size="15">point cloud -> object pose -> grasp -> basket</text>
    <rect x="48" y="226" width="292" height="36" rx="8" fill="#ffffff"/>
    <text x="66" y="249" fill="#1b2430" font-family="Menlo, Consolas, monospace" font-size="13">ros2 launch pick_place_solution ...</text>
  </g>

  <g transform="translate(524 172)">
    <rect width="390" height="282" rx="14" fill="#fff8e9" stroke="#e3bb68"/>
    <text x="28" y="44" fill="#46310f" font-family="Arial, sans-serif" font-size="24" font-weight="700">ShapeSorting</text>
    <circle cx="84" cy="119" r="28" fill="#ffffff" stroke="#10b981" stroke-width="5"/>
    <path d="M170 92 h56 l28 28 -28 28 h-56 l-28 -28z" fill="#ffffff" stroke="#8b5cf6" stroke-width="5"/>
    <rect x="288" y="88" width="64" height="64" rx="10" fill="#ef4444"/>
    <path d="M114 119 H142" stroke="#6b531f" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M256 119 H284" stroke="#6b531f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="46" y="196" fill="#6b531f" font-family="Arial, sans-serif" font-size="15">scan -> classify nought/cross -> sort objects</text>
    <rect x="46" y="226" width="306" height="36" rx="8" fill="#ffffff"/>
    <text x="64" y="249" fill="#1b2430" font-family="Menlo, Consolas, monospace" font-size="13">ros2 launch shape_sorting_solution ...</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#40566d"/>
    </marker>
  </defs>
</svg>
