<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ShapeSorting runtime process</title>
  <desc id="desc">Runtime flow from scene scan to shape recognition and sorted placement.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#f7f2ff"/>
  <rect x="54" y="48" width="1092" height="424" rx="18" fill="#ffffff" filter="url(#shadow)"/>
  <text x="88" y="102" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">ShapeSorting Runtime</text>
  <text x="88" y="134" fill="#475569" font-family="Arial, sans-serif" font-size="16">Scene scanning, reference matching, obstacle-aware planning, and sorted placement.</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="190" width="178" height="152" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <path d="M122 305 C158 228 205 228 238 305" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
    <circle cx="180" cy="268" r="13" fill="#8b5cf6"/>
    <text x="122" y="382" fill="#5b21b6" font-size="17" font-weight="700">1. Scene Scan</text>

    <path d="M284 266 H358" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M346 252 L362 266 L346 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="380" y="190" width="178" height="152" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <circle cx="438" cy="264" r="31" fill="#ffffff" stroke="#0891b2" stroke-width="6"/>
    <path d="M488 235 h46 l22 29 -22 29 h-46 l-22 -29z" fill="#ffffff" stroke="#0e7490" stroke-width="6"/>
    <text x="400" y="382" fill="#155e75" font-size="17" font-weight="700">2. Shape Match</text>

    <path d="M574 266 H648" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M636 252 L652 266 L636 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="670" y="190" width="178" height="152" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="720" y="232" width="46" height="72" rx="8" fill="#f59e0b"/>
    <path d="M790 232 L810 304" stroke="#92400e" stroke-width="9" stroke-linecap="round"/>
    <path d="M704 314 H824" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
    <text x="708" y="382" fill="#92400e" font-size="17" font-weight="700">3. Plan Around</text>

    <path d="M864 266 H938" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <path d="M926 252 L942 266 L926 280" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>

    <rect x="960" y="190" width="178" height="152" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="1000" y="238" width="48" height="72" rx="8" fill="#86efac"/>
    <rect x="1062" y="238" width="48" height="72" rx="8" fill="#bbf7d0"/>
    <circle cx="1024" cy="268" r="15" fill="#16a34a"/>
    <path d="M1074 253 h24 l12 15 -12 15 h-24 l-12 -15z" fill="#16a34a"/>
    <text x="998" y="382" fill="#166534" font-size="17" font-weight="700">4. Sorted Place</text>
  </g>

  <rect x="88" y="418" width="1002" height="1" fill="#e2e8f0"/>
  <text x="88" y="448" fill="#334155" font-family="Menlo, Consolas, monospace" font-size="15">bash scripts/run_project.sh shape-sorting launch</text>
